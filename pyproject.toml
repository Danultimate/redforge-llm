[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "redforge-llm"
version = "0.1.0"
description = "Adversarial testing for LLM applications. Pip install. Async-first. Reproducible."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Daniel Blanco" }]
keywords = ["llm", "security", "red-team", "adversarial", "prompt-injection", "jailbreak"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "pydantic>=2.6,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "anyio>=4.3,<5",
  "ulid-py>=1.1,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.40,<2"]
ollama = ["httpx>=0.27,<1"]
all = [
  "anthropic>=0.40,<1",
  "openai>=1.40,<2",
  "httpx>=0.27,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=4,<6",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
]

[project.scripts]
redforge = "redforge.cli:app"

[project.urls]
Documentation = "https://github.com/danultimate/redforge#readme"
Source = "https://github.com/danultimate/redforge"
Issues = "https://github.com/danultimate/redforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/redforge"]

[tool.hatch.build.targets.wheel.shared-data]
"src/redforge/attacks/data" = "redforge/attacks/data"
"src/redforge/scoring/rubrics" = "redforge/scoring/rubrics"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_api: tests that hit a real LLM provider; require provider API key env var and incur cost.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented API requires function calls in default args.
"src/redforge/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
