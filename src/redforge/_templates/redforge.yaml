# RedForge scan configuration. Generated by `redforge init`.
# Edit values below; the commented lines document the shipped defaults.

# Number of prompts sampled per attack variant. Set to null for the full corpus.
sample_size: 15

# Seed for deterministic prompt sampling.
seed: 42

# Where scan artifacts (run.jsonl, manifest.json, reports) are written.
artifact_dir: .redforge/runs

# When true, the scanner exits non-zero on any CRITICAL or HIGH finding,
# or when the scan completes with incomplete=true. Override per-run with
# `redforge scan --strict`.
strict: false

executor:
  max_concurrency: 8
  judge_concurrency: 4
  per_request_timeout_s: 30.0
  max_retries: 3
  retry_initial_delay_s: 1.0
  retry_jitter_factor: 0.3
  max_total_duration_s: 300.0
  # max_cost_usd: 1.00
  # cost_cap_action: degrade_to_heuristic   # or "fail"

# Target loader. Convention is `target.py` exporting `target`. Use
# `module:symbol` syntax if your callable lives elsewhere
# (e.g. "my_app.evals:scan_target").
target_spec: "target:target"

# Judge configuration. Set type to "none" for heuristic-only scoring.
# Heuristic-only is free and fast but has a higher false-positive rate
# (see DESIGN.md §6.4 for the published heuristic-only floors).
judge:
  type: anthropic
  model: claude-haiku-4-5-20251001
